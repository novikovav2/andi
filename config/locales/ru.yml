      half_a_minute: "меньше минуты"
      less_than_x_seconds:
        one: "меньше секунды"
        few: "меньше %{count} секунд"
        many: "меньше %{count} секунд"
        other: "меньше %{count} секунды"
      x_seconds:
        one: "%{count} секунда"
        few: "%{count} секунды"
        many: "%{count} секунд"
        other: "%{count} секунды"
      less_than_x_minutes:
        one: "меньше минуты"
        few: "меньше %{count} минут"
        many: "меньше %{count} минут"
        other: "меньше %{count} минуты"
      x_minutes:
        one: "%{count} минута"
        few: "%{count} минуты"
        many: "%{count} минут"
        other: "%{count} минуты"
      about_x_hours:
        one: "около %{count} часа"
        few: "около %{count} часов"
        many: "около %{count} часов"
        other: "около %{count} часа"
      x_days:
        one: "%{count} день"
        few: "%{count} дня"
        many: "%{count} дней"
        other: "%{count} дня"
      about_x_months:
        one: "около %{count} месяца"
        few: "около %{count} месяцев"
        many: "около %{count} месяцев"
        other: "около %{count} месяца"
      x_months:
        one: "%{count} месяц"
        few: "%{count} месяца"
        many: "%{count} месяцев"
        other: "%{count} месяца"
      about_x_years:
        one: "около %{count} года"
        few: "около %{count} лет"
        many: "около %{count} лет"
        other: "около %{count} года"
      over_x_years:
        one: "больше %{count} года"
        few: "больше %{count} лет"
        many: "больше %{count} лет"
        other: "больше %{count} года"
      almost_x_years:
        one: "почти %{count} год"
        few: "почти %{count} года"
        many: "почти %{count} лет"
        other: "почти %{count} года"

  errors:
    messages:
      blank: "не может быть пустым"
      taken: "уже используется"
      too_short:
        one: "слишком короткий (минимум %{count} символ)"
        few: "слишком короткий (минимум %{count} символа)"
        many: "слишком короткий (минимум %{count} символов)"
        other: "слишком короткий (минимум %{count} символа)"
