ru:
  date:
    formats:
      default: "%d.%m.%Y"
      long: "%-d %B %Y"
      short: "%-d %b"

    day_names:
      - воскресенье
      - понедельник
      - вторник
      - среда
      - четверг
      - пятница
      - суббота

    abbr_day_names:
      - вс
      - пн
      - вт
      - ср
      - чт
      - пт
      - сб

    month_names:
      -
      - января
      - февраля
      - марта
      - апреля
      - мая
      - июня
      - июля
      - августа
      - сентября
      - октября
      - ноября
      - декабря

    abbr_month_names:
      -
      - янв.
      - февр.
      - мар.
      - апр.
      - мая
      - июн.
      - июл.
      - авг.
      - сент.
      - окт.
      - нояб.
      - дек.

  datetime:
